services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: future_forward_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: navigator
      POSTGRES_PASSWORD: navigator_dev_password
      POSTGRES_DB: future_forward_navigator
    ports:
      - "5433:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
